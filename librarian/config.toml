# Librarian runtime configuration.
#
# Self-contained: every knob the agent reads must be set here, there is no
# fallback and no env-var override. Schema + what each knob means:
# LibrarianRuntimeConfig in config.py. Comments in this file explain only why
# these values are what they are.
#
# The values below are the ones that produced the LitQA2 accuracy reported in
# the README — change them only if you intend to change retrieval behaviour.
# For a one-off change (an ablation sweep, say), don't edit this file: use
# dataclasses.replace() on the loaded config (see config.py).

# Model requested when llm_model_name isn't passed to LibrarianAgent.
# Empty means "no opinion": the LLM client falls back to the LLM_MODEL env var,
# which is how this open-source build is normally pointed at a backend.
default_model_name = ""

# Verbatim from bio-agents' agents/librarian/config_prod.toml, so both repos plan
# queries the same way. {max_queries} is filled at prompt-build time from
# num_subqueries, so the cap and the instruction to the planner always agree.
# The recall/coverage/precision split lives here rather than in the prompt: it is
# the tunable part, and it is what MIN_SUBQUERIES = 3 exists to protect — a budget
# below 3 cannot give each role a query.
query_budget_guidance = """
Generate AT MOST {max_queries} complementary queries, spent as follows (recall over precision — a downstream filter handles precision):
- AT MOST ~2/5 of them as recall queries — broad plain-text baselines, no field tags, core concepts joined with OR synonyms. Your recall safety net. Keep them genuinely different: vary the phrasing and the synonym set, do not re-emit one query three ways.
- AT MOST ~2/5 of them as coverage queries — distinct angles on the question: a different synonym set, a related sub-concept, or a different field/entity from the syntax reference below. One concept each, at most 1 AND.
- AT MOST ~1/5 of them as precision queries — targeted structured queries using whichever fields from the reference best fit the co-required concepts (controlled vocabulary, entity, or section fields), at most 1 AND. When an exact answer exists, these find it."""

# 7 sub-queries: the Stage-2 fan-out runs one search+BM25 thread per sub-query,
# sized to the CPUs actually available (see _available_cpus in agent.py).
num_subqueries = 7
# 50 × 7 = 350 raw papers pooled across sub-queries. Every returned paper is
# decomposed into paragraphs and BM25-ranked, so this is also the per-sub-query
# recall lever.
papers_per_subquery = 50
paragraphs_per_subquery = 16
# 16 × 7 = 112 ≤ 128 — the whole pool is judged in one call (see config.py).
paragraphs_per_judge_batch = 128

max_paragraph_words = 250
paragraph_overlap_words = 50
# 0.1 is the winning LitQA2 config; use 0 for deterministic, reproducible filtering.
filter_temperature = 0.1
# Generous margin over a plain JSON id-list response so a wide batch doesn't get
# silently truncated. Reasoning models need more (their trace counts against it).
filter_max_tokens = 8192

# Supplementary material: off by default, because the values above are the ones
# that produced the published LitQA2 numbers and they were measured without it.
# Turning it on downloads the supplementary documents of every open-access paper
# that declares any (from the PMC bucket on AWS), so Stage 2 gets slower.
supplementary_enrichment = false
# 15 MB of documents per paper. Measured on PMC supplements: median 1.7 MB per
# paper, 90th percentile 10.6 MB; the few files over 10 MB (5%) are image-heavy
# PDFs holding about half of all bytes, yet a paper contributes at most
# max_supplementary_records_per_paper records. Every LAB-Bench SuppQA paper
# (largest 14.2 MB) fits. Also caps the Europe PMC ZIP fallback.
max_supplementary_bytes = 15_000_000
# 40 records ≈ a 40-page PDF. The body of a paper is usually 40–80 paragraphs,
# so a supplement can at most match it, not drown it.
max_supplementary_records_per_paper = 40
# pypdf flattens PDF tables into run-on text; "docling" keeps their rows and
# headers (it recovered a SuppQA answer pypdf lost) but costs ~6 s per page on
# CPU plus ~0.5 GB of models, so it is opt-in. Records are cached (see
# LIBRARIAN_CACHE_DIR), so each file is converted once.
supplementary_pdf_extractor = "pypdf"
