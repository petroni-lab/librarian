name: Skill launchers

on:
  push:
    paths:
      - 'skills/librarian/scripts/**'
      - 'tests/test_skill_launchers.py'
      - 'tests/test_skill_macos_sandbox.py'
      - '.github/workflows/skill-launchers.yml'
  pull_request:
    paths:
      - 'skills/librarian/scripts/**'
      - 'tests/test_skill_launchers.py'
      - 'tests/test_skill_macos_sandbox.py'
      - '.github/workflows/skill-launchers.yml'

jobs:
  launchers:
    runs-on: windows-latest
    strategy:
      matrix:
        powershell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test CLI discovery and Windows launcher
        env:
          LIBRARIAN_TEST_POWERSHELL: '${{ matrix.powershell }}'
        run: python -m unittest discover -s tests -p test_skill_launchers.py -v

  macos-sandbox:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install . pytest
      - name: Test missing tools and provider recovery without network or credentials
        run: python -m pytest tests/test_skill_macos_sandbox.py -q
