# Runs offline pipeline tests and checks the Windows launcher's first-run
# downloads. Neither job needs an LLM endpoint, Europe PMC access, or secrets.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true # a newer push to the same branch supersedes this run
permissions: {}
jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.2 # setup-uv publishes no major-version tag
        with:
          python-version: "3.11" # the version the dev environment and fixtures use
      # The supplementary extra is needed by the supplementary-extraction tests;
      # the dev group (pytest) is included by default. --locked fails on a stale uv.lock.
      - run: uv sync --locked --extra supplementary
      - run: uv run pytest tests
  windows-skill-launcher:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python and start the skill in one invocation
        shell: powershell
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/librarian uv cache
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/librarian python
          UV_MANAGED_PYTHON: '1'
          UV_PYTHON: '3.11'
        run: |
          $git = (Get-Command git -CommandType Application | Select-Object -First 1).Source
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and !(Test-Path -LiteralPath (Join-Path $_ 'uv.exe')) }) -join ';'
          if ((Test-Path -LiteralPath $env:UV_CACHE_DIR) -or (Test-Path -LiteralPath $env:UV_PYTHON_INSTALL_DIR)) {
              throw 'The uv cache and managed Python directory must start empty'
          }
          if ((Get-Command uv -CommandType Application -ErrorAction SilentlyContinue) -or
              (Test-Path -LiteralPath "$HOME/.local/bin/uv.exe") -or
              (Test-Path -LiteralPath "$HOME/.cargo/bin/uv.exe")) {
              throw 'The launcher must start without an available uv executable'
          }
          & .\skills\librarian\scripts\run.ps1 search --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath (Join-Path $env:UV_CACHE_DIR 'librarian-bin/uv.exe'))) {
              throw 'Skill did not install uv from a fresh cache'
          }
          $env:UV_OFFLINE = '1'
          & .\skills\librarian\scripts\run.ps1 search --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath .venv) { throw 'Skill created .venv in the plugin checkout' }
          & $git diff --exit-code -- uv.lock
