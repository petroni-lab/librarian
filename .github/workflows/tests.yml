# Runs the test suite on every pull request and every push to main. Fully offline:
# recorded runs are replayed from tests/fixtures/, so no LLM endpoint, Europe PMC
# access or secrets are needed.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true # a newer push to the same branch supersedes this run
permissions: {}
jobs:
  pytest-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    strategy:
      fail-fast: false
      matrix:
        # Test the declared minimum (pyproject.toml requires-python) and the dev/eval version.
        python-version: ["3.10", "3.11"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.2 # setup-uv publishes no major-version tag
        with:
          python-version: ${{ matrix.python-version }}
      # The supplementary extra is needed by the supplementary-extraction tests;
      # the dev group (pytest) is included by default. --locked fails on a stale uv.lock.
      - run: uv sync --locked --extra supplementary
      - run: uv run pytest tests
  pytest:
    # Stable check name required by the main branch ruleset; aggregates the Python matrix.
    runs-on: ubuntu-latest
    needs: [pytest-matrix]
    if: ${{ !cancelled() }}
    steps:
      - run: |
          if [ "${{ needs.pytest-matrix.result }}" != "success" ]; then
            exit 1
          fi
