# literature_eval.conf — the one place to point the literature benchmarks at your
# own endpoints and scratch space.
#
# Sourced by literature_eval.sh before it reads anything else. Every entry uses
# `: "${VAR:=default}"`, which assigns ONLY when the variable is unset, so a real
# environment variable always wins over this file:
#
#   LIBRARIAN_URL=http://myhost:8080/v1 ./evals/Literature/literature_eval.sh --bench litqa2
#
# To keep a personal profile outside the repo, copy this file and point
# LITERATURE_EVAL_CONFIG at it:
#
#   LITERATURE_EVAL_CONFIG=~/my_eval.conf ./evals/Literature/literature_eval.sh --bench litqa2
#
# Running a per-bench runner standalone? Source this first:
#   LITERATURE_DIR=evals/Literature . evals/Literature/literature_eval.conf
#
# NOTHING HERE IS GUESSED FOR YOU. LIBRARIAN_URL has no useful default — it is
# the endpoint serving the model the librarian plans and judges with, and you
# have to serve it (or point at a provider) yourself. See ../../README.MD.

# ── Endpoints and models ─────────────────────────────────────────────────────
# The librarian/retrieval model: an OpenAI-compatible base URL, and the id that
# endpoint serves it under. This is the one endpoint EVERY bench needs.
#
# The paper's numbers are GLM-5 numbers (`zai-org/GLM-5-FP8`, served as
# `glm-5-fp8`). Any OpenAI-compatible endpoint works — a local vLLM, or a
# provider — but a different model makes the numbers incomparable rather than
# wrong, so say so when you report them.
: "${LIBRARIAN_URL:=}"
: "${LIBRARIAN_MODEL:=glm-5-fp8}"
# SQA synthesis defaults to the librarian model; set it to split the two roles.
: "${SYNTHESIS_MODEL:=$LIBRARIAN_MODEL}"
# LitQA2 answering model + open-judge (benchmark design, not a substitution).
: "${ANSWER_MODEL:=gpt-5.4}"
: "${ANSWER_URL:=https://api.openai.com/v1}"
: "${LITQA2_JUDGE_MODEL:=openai/gpt-4o-2024-11-20}"
# ProClaim verdict / evidence programmer. Needs ANTHROPIC_API_KEY in .env.
: "${PROCLAIM_VERDICT_MODEL:=claude-sonnet-4-6}"
: "${PROCLAIM_VERDICT_URL:=https://api.anthropic.com/v1}"
# ProClaim's second arm (the full ProClaim pipeline) retrieves in-process and
# takes its own endpoint, so it can be split from the one above. Defaults to
# the same librarian.
: "${PROCLAIM_LIBRARIAN_URL:=$LIBRARIAN_URL}"
: "${PROCLAIM_LIBRARIAN_MODEL:=$LIBRARIAN_MODEL}"
# ProClaim's evidence subagent — a THIRD endpoint, used by `--only proclaim`
# (arm 2) and not by `--only verifier`. run_proclaim.sh does not start it: if
# nothing answers here it prints the `vllm serve` line and stops.
: "${PROCLAIM_SUBAGENT_URL:=http://localhost:9900/v1}"
: "${PROCLAIM_SUBAGENT_MODEL:=qwen3.5-9b}"

# ── The --via-api path (optional) ────────────────────────────────────────────
# Where `orchestrator.py` is listening, for runs started with --via-api. Start
# it from the repository root with:
#
#   uv run uvicorn orchestrator:app --port 8080
#
# The default is in-process, which needs none of this. See orchestrator_client.py
# for when routing through a server is worth it.
: "${LIBRARIAN_API_URL:=http://localhost:8080}"
# The model that server was started with. Used only to LABEL results produced on
# the API path, where the per-bench LIBRARIAN_MODEL does not apply: the server
# runs the config it was started with.
: "${LIBRARIAN_API_MODEL:=$LIBRARIAN_MODEL}"

# ── User-specific paths ──────────────────────────────────────────────────────
# Where eval outputs land. Nothing under it is committed.
: "${RESULTS_ROOT:=${LITERATURE_DIR:-.}/results}"
# Interpreter. Resolved rather than guessed: `uv sync` creates .venv without
# putting it on PATH, and a bare `python` is absent entirely on many systems.
# Preference order is $PYTHON, then the repo's .venv, then python3. Setting it
# explicitly always wins; `uv run` works too: PYTHON="uv run python".
if [ -z "${PYTHON:-}" ]; then
    _lit_root="${REPO_ROOT:-${LITERATURE_DIR:-.}/../..}"
    if [ -x "$_lit_root/.venv/bin/python" ]; then
        PYTHON="$_lit_root/.venv/bin/python"
    elif command -v python3 >/dev/null 2>&1; then
        PYTHON=python3
    else
        PYTHON=python
    fi
    unset _lit_root
fi
# HF cache for the models a bench loads locally (ProClaim's evidence subagent,
# SQA's AutoAIS scorer and Prometheus judges). Must be writable by you; the
# weights run to tens of GB.
: "${HF_HOME:=$HOME/.cache/huggingface}"

# ── Apptainer (only used by sqa --only multi) ────────────────────────────────
# The container the Prometheus judges' vLLM runs in. No default that is right
# for everyone — point it at a vllm-openai image you can read.
: "${APPTAINER_IMAGE:=}"

# ── Concurrency and resources ────────────────────────────────────────────────
# MAX_SAMPLES is Inspect's *concurrency*, not a question count — use --limit N
# to shrink a run. None of these change scores, only wall-clock.
#
# 16 was MEASURED on the deployment the paper ran on (SQA, 32 questions of
# scholarqa_bio: 8 -> 11.1 s/q, 16 -> 9.1 s/q, 32 -> 17.9 s/q). 32 was SLOWER
# than 8 because each agent run fans out to 8 concurrent judge calls, so N runs
# put up to 8N requests on one shared endpoint. The ceiling is that fan-out, not
# the bench — but the right number depends on the endpoint you serve, so treat
# 16 as a starting point and re-measure against yours.
: "${MAX_SAMPLES:=16}"
: "${MAX_CONNECTIONS:=16}"
# MAX_WORKERS is deliberately left UNSET: a default here would override every
# bench's own, which are not interchangeable — sqa --via-api wants 16 (agent
# runs on the server), sqa in-process wants ~4 (Stage-2 BM25 on this box),
# labbench wants 8. Set it to force one number across all of them.
# GPUs for the Prometheus judges in `sqa --only multi` (tensor-parallel size).
: "${JUDGE_GPUS:=4}"

export LIBRARIAN_URL LIBRARIAN_MODEL SYNTHESIS_MODEL
export ANSWER_MODEL ANSWER_URL LITQA2_JUDGE_MODEL
export PROCLAIM_VERDICT_MODEL PROCLAIM_VERDICT_URL
export PROCLAIM_LIBRARIAN_URL PROCLAIM_LIBRARIAN_MODEL
export PROCLAIM_SUBAGENT_URL PROCLAIM_SUBAGENT_MODEL
export LIBRARIAN_API_URL LIBRARIAN_API_MODEL HF_HOME
export RESULTS_ROOT PYTHON
export APPTAINER_IMAGE
export MAX_SAMPLES MAX_CONNECTIONS MAX_WORKERS JUDGE_GPUS
