[project]
name = "librarian"
version = "1.0.0"
description = "A life-sciences knowledge layer for AI agents: natural-language questions to ranked Europe PMC evidence passages."
readme = "README.MD"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.31",   # Europe PMC HTTP calls + OpenAI-compatible LLM client
    "bm25s>=0.2",       # BM25 paragraph ranking
    "pysbd>=0.3",       # sentence segmentation for evidence extraction
    "python-dotenv>=1.0", # load LLM_* config from a .env file
    "PyStemmer>=2.2",   # Snowball stemming for BM25 paragraph scoring
    "mashumaro[toml]>=3.22", # dataclass <-> TOML parsing for librarian/config.toml
    "pypdf>=4.0",       # text from supplementary-material PDFs
    "python-docx>=1.1", # text from supplementary-material .docx files
    "fastapi>=0.110",   # HTTP orchestrator (orchestrator.py)
    "uvicorn>=0.27",    # ASGI server for the orchestrator
    "diskcache>=5.6",   # local Europe PMC cache (EPMC_CACHE_DIR)
]

# The benchmark harness under evals/Literature deliberately adds nothing here.
# Each bench builds its own locked virtualenv on first use.

# A real build backend so `pip install <github tarball>` builds a usable wheel
# (how downstream projects install it). Only the library package ships:
# main.py, orchestrator.py, skills/, evals/ and tests/ stay in the checkout.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["librarian"]

# pip ignores this; it keeps `uv sync` / `uv run` from installing the project
# itself into the dev venv, which runs straight from the checkout.
[tool.uv]
package = false
